name: checks

on:
  push:
    branches: [main]  # branches are checked by their pull request (saves CI minutes)
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Repository check (keys, certificates, deny-list)
        env:
          FORBIDDEN_PATTERNS: ${{ secrets.FORBIDDEN_PATTERNS }}
          # Required on this repository; forks and pull requests from forks
          # have no access to the secret and run the key check only.
          REQUIRE_DENYLIST: ${{ github.repository == 'Chargetronic/imatra.test_harness' && github.event_name == 'push' && '1' || '0' }}
        run: bash scripts/check-repo.sh --history

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r conformance/requirements.txt
      - name: Checker against the pinned contracts
        working-directory: conformance
        run: python -m pytest -q tests

  layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: layer/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r conformance/requirements.txt
      - name: Answers for every outcome against the contracts
        working-directory: layer
        run: |
          CONTRACT_OUT=$RUNNER_TEMP/answers.jsonl go test ./...
          cat $RUNNER_TEMP/answers.jsonl $RUNNER_TEMP/answers.jsonl.registry > $RUNNER_TEMP/all.jsonl
          cd ../conformance && python -m conformance batch $RUNNER_TEMP/all.jsonl
      - name: Smoke test of the running layer (Mosquitto, mTLS)
        run: |
          set -e
          dc="docker compose -f compose/layer.yml"
          $dc up -d --build
          $dc run --rm -T layer layer provision dev-01 > compose/smoke/dev-01.json
          $dc run --rm -T layer layer bind dev-01
          $dc --profile smoke run --rm smoke
      - name: Logs
        if: failure()
        run: docker compose -f compose/layer.yml logs

  station:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r conformance/requirements.txt -r station/requirements.txt pytest
      - name: Station protocol logic, every message against the contracts
        working-directory: station
        run: python -m pytest -q tests

  e2e:
    # Imatra (pinned) + test layer + test station + test EV, one full session.
    # Needs read access to the Imatra repository while it is private.
    runs-on: ubuntu-latest
    needs: [layer, station]
    env:
      HAS_TOKEN: ${{ secrets.CONTRACTS_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - id: ref
        run: echo "imatra=$(cat contracts/IMATRA_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: env.HAS_TOKEN == 'true'
        with:
          repository: Chargetronic/imatra.iso15118_server
          ref: ${{ steps.ref.outputs.imatra }}
          path: imatra
          token: ${{ secrets.CONTRACTS_READ_TOKEN }}
      - name: Start Imatra and the harness
        if: env.HAS_TOKEN == 'true'
        run: IMATRA_DIR=$GITHUB_WORKSPACE/imatra compose/up.sh
      - name: One charging session end to end
        if: env.HAS_TOKEN == 'true'
        run: IMATRA_DIR=$GITHUB_WORKSPACE/imatra WATCH_S=300 compose/e2e.sh
      - name: "Scenario T2: operator commands during a session"
        if: env.HAS_TOKEN == 'true'
        run: IMATRA_DIR=$GITHUB_WORKSPACE/imatra compose/scenarios.sh t2
      - name: "Scenario T3: the test layer stops during a session"
        if: env.HAS_TOKEN == 'true'
        run: IMATRA_DIR=$GITHUB_WORKSPACE/imatra compose/scenarios.sh t3
      - name: "Scenario T6: an EV without TLS"
        if: env.HAS_TOKEN == 'true'
        run: IMATRA_DIR=$GITHUB_WORKSPACE/imatra compose/scenarios.sh t6
      - name: "Scenario T4: the registry"
        if: env.HAS_TOKEN == 'true'
        run: IMATRA_DIR=$GITHUB_WORKSPACE/imatra compose/scenarios.sh t4
      - name: "Scenario T7: negative security checks"
        if: env.HAS_TOKEN == 'true'
        run: IMATRA_DIR=$GITHUB_WORKSPACE/imatra compose/scenarios.sh t7
      - name: "Scenario T5: PKI_MODE=own (last: replaces the deployment)"
        if: env.HAS_TOKEN == 'true'
        run: IMATRA_DIR=$GITHUB_WORKSPACE/imatra compose/scenarios.sh t5
      - name: Logs
        if: failure() && env.HAS_TOKEN == 'true'
        run: |
          docker compose -f compose/harness.yml logs --tail 200 layer station ev
          docker compose -p imatra-harness-server --project-directory imatra -f imatra/docker-compose.yml logs --tail 100 engine mqtt
      - name: No token
        if: env.HAS_TOKEN != 'true'
        run: echo "CONTRACTS_READ_TOKEN is not set; end-to-end test skipped"
