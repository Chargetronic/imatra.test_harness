# The test layer's broker. Internal network of the harness only: no port is
# published (TK-7). Client certificate under the test layer CA required; its
# CN is the user name.
listener 8883
cafile /data/pki/layer-ca.crt
certfile /data/pki/layer-broker/server.crt
keyfile /data/pki/layer-broker/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
acl_file /mosquitto/config/acl
persistence false
log_dest stdout
